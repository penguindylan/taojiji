backend:
  name: github
  repo: penguindylan/taojiji
  branch: main
  base_url: https://YOUR-OAUTH-PROXY-DOMAIN
  auth_endpoint: auth

media_folder: image/updates
public_folder: image/updates

collections:
  - name: updates
    label: 更新日誌
    files:
      - name: latest
        label: 最新消息
        file: data/updates.json
        fields:
          - name: updates
            label: 貼文
            widget: list
            label_singular: 一則更新
            fields:
              - name: date
                label: 發布日期
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
              - name: title
                label: 標題
                widget: string
              - name: caption
                label: 貼文說明
                widget: text
                required: false
              - name: instagram_url
                label: Instagram 貼文網址
                widget: string
                pattern:
                  - "https://(www\\.)?instagram\\.com/.+"
                  - 請輸入 Instagram 貼文網址
              - name: image
                label: 貼文圖片（選填）
                widget: image
                required: false
